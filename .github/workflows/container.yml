name: container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/wptk/hypertracker

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image (not pushed yet)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          push: false
          tags: hypertracker:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -eu
          data="$(mktemp -d)"
          chmod 777 "$data"
          docker run -d --name smoke \
            --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -e SECRET_KEY="$(head -c 32 /dev/urandom | base64)" \
            -e DEV_MODE=false \
            -e TRUSTED_PROXY=cloudflare \
            -v "$data:/app/data" \
            -p 127.0.0.1:8008:8008 \
            hypertracker:smoke
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8008/; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "app did not answer in time"
            docker logs smoke
            exit 1
          fi
          code_root="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8008/)"
          code_docs="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8008/docs)"
          uid="$(docker exec smoke id -u)"
          echo "GET / -> $code_root, GET /docs -> $code_docs, uid -> $uid"
          [ "$code_root" = "200" ] || { echo "GET / was not 200"; docker logs smoke; exit 1; }
          [ "$code_docs" = "404" ] || { echo "GET /docs was not 404"; exit 1; }
          [ "$uid" != "0" ] || { echo "process is running as root"; exit 1; }
          test -f "$data/flightboard.db" || { echo "database was not created in the data mount"; exit 1; }
          docker rm -f smoke

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short sha for the tag
        run: echo "SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_ENV"

      - name: Push latest and sha tags
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ env.SHORT_SHA }}
          cache-from: type=gha
