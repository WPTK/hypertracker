name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main, "claude/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q -m "not e2e and not live"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-e2e.txt
      - run: pip install -r requirements-e2e.txt
      - name: Install chromium
        run: playwright install --with-deps chromium
      - name: Browser tests
        run: pytest -m e2e -rs
        env:
          E2E_FAIL_ON_SKIP: "1"   # a skipped browser test must never look like a pass
      - name: Contrast check
        run: |
          if [ -f tools/contrast_check.py ]; then
            python tools/contrast_check.py
          else
            echo "tools/contrast_check.py not present, skipping"
          fi
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            tests/e2e/**/screenshots/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
